name: Deploy to GitHub Pages

# Builds the site and pushes it to a `gh-pages` branch.
#
# This is the branch-based publishing method rather than the newer
# "Source: GitHub Actions" one, because that mode requires Pages to be enabled
# through the repo UI first and the workflow token cannot do it. Creating a
# gh-pages branch, by contrast, is something the workflow can do on its own —
# and GitHub often auto-enables Pages the first time that branch appears.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (base path /focusflow/)
        run: npm run build:pages

      # Hash routing means no 404.html is needed, but .nojekyll is: without it
      # GitHub Pages' Jekyll pass strips paths that start with an underscore.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
