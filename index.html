<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FocusFlow — ADHD-friendly planner</title>
    <meta name="description" content="A calm, low-friction daily planner, introspection journal, and weekly/monthly/yearly progress tracker built for ADHD brains. Works offline; your data stays on your device." />

    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta name="theme-color" content="#0b1211" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0fdfa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS home-screen behaviour: full-screen, dark status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FocusFlow" />

    <!-- Plus Jakarta Sans is bundled via @fontsource-variable in src/index.css,
         so there is no third-party font request to block first paint. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
