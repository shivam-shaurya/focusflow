<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FocusFlow — ADHD-friendly planner</title>
    <meta name="description" content="A calm, low-friction daily planner, introspection journal, and weekly/monthly/yearly progress tracker built for ADHD brains. Works offline; your data stays on your device." />

    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta name="theme-color" content="#020907" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef6f5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!--
      iOS home-screen behaviour. `black` keeps the web view BELOW the status bar;
      `black-translucent` pushes content underneath it, which put the header and
      the nav drawer under the clock and made them untappable in standalone mode.
      viewport-fit=cover stays so the home indicator and landscape notch are still
      reported through env(safe-area-inset-*), which the layout pads for.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="FocusFlow" />

    <!-- Plus Jakarta Sans is bundled via @fontsource-variable in src/index.css,
         so there is no third-party font request to block first paint. -->
    <script type="module" crossorigin src="/focusflow/assets/index-Bkme_Wb2.js"></script>
    <link rel="stylesheet" crossorigin href="/focusflow/assets/index-CYRnnYFD.css">
  <link rel="manifest" href="/focusflow/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
